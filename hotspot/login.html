<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">

  <title>CEIS | Acceso Wi-Fi</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  $(if chap-id)
  <!-- Formulario oculto para autenticación CHAP de MikroTik -->
  <form name="sendin" action="$(link-login-only)" method="post">
    <input type="hidden" name="username">
    <input type="hidden" name="password">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
  </form>

  <script src="/md5.js"></script>

  <script>
    function doLogin() {
      document.sendin.username.value =
        document.login.username.value;

      document.sendin.password.value = hexMD5(
        '$(chap-id)' +
        document.login.password.value +
        '$(chap-challenge)'
      );

      document.sendin.submit();
      return false;
    }
  </script>
  $(endif)

  <main class="login-page">

    <div class="login-overlay" aria-hidden="true"></div>

    <section class="login-card" aria-labelledby="login-title">

      <h1 class="login-title" id="login-title">
        <img
          src="./CEIS-png-clean.png"
          alt="CEIS — Centro de Estudiantes de Ingeniería de Sistemas"
        >
      </h1>

      <p class="login-subtitle">
        Ingeniería de Sistemas — Red Wi-Fi
      </p>

      <!-- Mensaje de error -->
      <div
        class="login-error"
        id="alert"
        role="alert"
        hidden
      >
        <span id="alertText">
          Código SIS o carnet de C.I. incorrecto.
        </span>
      </div>

      <!-- Error devuelto por MikroTik -->
      <span id="mtError" hidden>$(error)</span>

      <!-- Formulario de autenticación -->
      <form
        name="login"
        id="loginForm"
        class="login-form"
        action="$(link-login-only)"
        method="post"
        autocomplete="off"
        $(if chap-id) onsubmit="return doLogin()" $(endif)
      >

        <input
          type="hidden"
          name="dst"
          value="$(link-orig)"
        >

        <input
          type="hidden"
          name="popup"
          value="$(popup)"
        >

        <div class="login-fields">
          
          <!-- Grupo Usuario -->
          <div class="input-group">
            <label class="login-label" for="username">
              USUARIO CÓDIGO SIS
            </label>
            <input
              class="login-input"
              id="username"
              name="username"
              type="text"
              value="$(username)"
              inputmode="numeric"
              autocapitalize="off"
              autocorrect="off"
              placeholder="Ej. 201801234"
              autocomplete="username"
              required
              autofocus
            >
          </div>

          <!-- Grupo Contraseña -->
          <div class="input-group">
            <label class="login-label" for="password">
              CONTRASEÑA NÚMERO DE CARNET
            </label>
            <input
              class="login-input"
              id="password"
              name="password"
              type="password"
              placeholder="Ej. 15279275"
              autocomplete="current-password"
              autocapitalize="off"
              autocorrect="off"
              required
            >
          </div>

        </div>

        <div class="login-options">
          <a
            href="https://wa.me/59160702382?text=Hola%2C%20tengo%20problemas%20de%20acceso%20a%20la%20red%20Wi-Fi%20del%20CEIS."
            class="forgot-link"
            target="_blank"
            rel="noopener noreferrer"
          >
            ¿Problemas de acceso?
          </a>
        </div>

        <button
          class="login-button"
          id="submitBtn"
          type="submit"
        >
          Entrar
        </button>

      </form>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
